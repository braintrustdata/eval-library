[project]
name = "glm-5-2-long-context-eval"
version = "0.1.0"
description = "Braintrust eval for exact long-context code retrieval with GLM-5.2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "autoevals==0.3.0",
    "braintrust==0.25.0",
    "openai==2.43.0",
    "python-dotenv==1.2.2",
    "tiktoken==0.13.0",
]

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[tool.ruff]
line-length = 100
